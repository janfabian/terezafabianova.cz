name: Deploy

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Prevent concurrent deploys racing on the same ref.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Stage only the files we actually want to publish, so .github,
      # .claude, README.md etc. don't end up on gh-pages.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='_site' \
            ./ _site/

      # Production deploy: pushes to master replace the root of gh-pages,
      # but keep the pr-preview/ subtree so open PRs stay reachable.
      - name: Deploy to production
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/

      # PR preview deploy: every PR event mounts the site at
      # /pr-preview/pr-<number>/ on the gh-pages branch and comments
      # the URL on the PR. On PR close, the preview is removed.
      - name: Deploy / clean up PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
