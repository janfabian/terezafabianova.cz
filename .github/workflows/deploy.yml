name: Deploy

on:
  push:
    branches: [master]
    # Skip when only non-site files change.
    paths-ignore:
      - 'README.md'
      - '.claude/**'
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths-ignore:
      - 'README.md'
      - '.claude/**'

# Two distinct concurrency lanes so prod and PR events never cancel each other:
# - Production (push to master): queue, never cancel — every commit must deploy.
# - PR previews: cancel-in-progress so a fast-follow commit supersedes the old build.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('pages-pr-{0}', github.event.number)
        || 'pages-prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Generate blog.html, posts/<slug>.html, sitemap.xml from posts/*.json.
      # The script has zero dependencies (node stdlib only), no install step.
      - name: Build blog
        run: node scripts/build-blog.mjs

      # Stage only the files we actually want to publish, so .github,
      # .claude, README.md, scripts/, posts/*.json etc. don't end up on gh-pages.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='_site' \
            --exclude='scripts' \
            --exclude='posts/*.json' \
            ./ _site/

      # Production deploy: pushes to master replace the root of gh-pages,
      # but keep the pr-preview/ subtree so open PRs stay reachable.
      - name: Deploy to production
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
          # Persist the custom-domain marker. The clean deploy above would
          # otherwise drop CNAME, which makes GitHub Pages unset the custom
          # domain and revert the site to janfabian.github.io.
          cname: terezafabianova.cz

      # PR preview deploy: every PR event mounts the site at
      # /pr-preview/pr-<number>/ on the gh-pages branch and comments
      # the URL on the PR. On PR close, the preview is removed.
      - name: Deploy / clean up PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
